name: Chat Bubble Regression

on:
  pull_request:
    paths:
      - "src/components/chat/**"
      - "src/lib/linkify.tsx"
      - "src/lib/__tests__/linkify.test.tsx"
      - "scripts/chat-bubble-regression.py"
      - ".github/workflows/chat-bubble-regression.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run linkify unit tests
        run: bunx vitest run src/lib/__tests__/linkify.test.tsx

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Chat bubble width regression
        run: python scripts/chat-bubble-regression.py

      - name: Upload regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-bubble-regression-screenshots
          path: /tmp/browser/chat-regression/*.png
          if-no-files-found: ignore
