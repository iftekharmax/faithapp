# Supabase CLI project config
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "qdveirhlzuzrxaqjevxr"

[db]
# Local dev DB port (only used with `supabase start`)
port = 54322
major_version = 15

[db.migrations]
schema_paths = []

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
